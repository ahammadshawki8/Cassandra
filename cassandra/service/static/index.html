<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cassandra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --milk:   #FBF7FF;
    --card:   #FFFFFF;
    --ink:    #33304A;
    --soft:   #7B7694;
    --faint:  #ACA6C4;
    --edge:   #EDE7F8;
    --iris:   #7B6CF6;
    --iris-d: #5B4BD6;
    --blush:  #FF8BA7;
    --matcha: #4FC3A1;
    --honey:  #FFC145;

    --display: "Baloo 2", ui-rounded, system-ui, sans-serif;
    --body: Nunito, ui-rounded, -apple-system, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

    --r: 20px;
    --shadow: 0 2px 4px rgba(51,48,74,.04), 0 12px 28px -12px rgba(91,75,214,.16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--milk); color: var(--ink);
    font: 16px/1.6 var(--body);
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(123,108,246,.07), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,139,167,.07), transparent 38%);
  }
  .wrap { width: 100%; max-width: 620px; }

  /* ---------- header ---------- */
  .hero { text-align: center; margin-bottom: 30px; }
  .face { margin: 0 auto 12px; display: block; }
  h1 {
    font: 800 34px/1 var(--display); margin: 0 0 8px;
    letter-spacing: -.01em; color: var(--ink);
  }
  .promise { color: var(--soft); font-size: 16px; margin: 0 auto; max-width: 420px; }
  .promise b { color: var(--iris-d); font-weight: 700; }

  /* ---------- shared card ---------- */
  .card {
    background: var(--card); border: 1px solid var(--edge);
    border-radius: var(--r); box-shadow: var(--shadow);
    padding: 22px; margin-bottom: 16px;
  }
  .card.tight { padding: 16px 20px; }

  /* ---------- step 1, the only control ---------- */
  .start { text-align: center; }
  .filename {
    font: 500 13px var(--mono); color: var(--soft);
    background: var(--milk); border: 1px solid var(--edge);
    border-radius: 10px; padding: 8px 14px; display: inline-block; margin-bottom: 18px;
  }
  .filename span { color: var(--iris-d); }
  button {
    font: 700 16px var(--body); color: #fff;
    background: linear-gradient(180deg, var(--iris), var(--iris-d));
    border: 0; border-radius: 14px; padding: 15px 34px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(91,75,214,.28); transition: transform .12s, box-shadow .12s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 rgba(91,75,214,.28); }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(91,75,214,.28); }
  button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  .hint { color: var(--faint); font-size: 13px; margin-top: 14px; }

  /* ---------- step 2, one activity line ---------- */
  .now { display: flex; align-items: center; gap: 14px; }
  .now .txt { flex: 1; min-width: 0; }
  .now .phase { font: 700 16px var(--body); color: var(--ink); }
  .now .detail {
    font: 400 13px var(--mono); color: var(--soft); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .now.retry .phase { color: var(--honey); }
  .beads { display: flex; gap: 6px; margin-top: 16px; }
  .bead { height: 6px; flex: 1; border-radius: 99px; background: var(--edge); transition: background .4s; }
  .bead.on { background: var(--iris); }
  .bead.on.warn { background: var(--honey); }

  /* ---------- step 3, the headline ---------- */
  .verdict { text-align: center; padding: 30px 22px; }
  .verdict .label {
    font: 700 12px var(--body); letter-spacing: .1em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 14px;
  }
  .verdict .name { font: 700 17px var(--body); color: var(--ink); margin-bottom: 12px; }
  .nums { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .was {
    font: 500 20px var(--mono); color: var(--faint);
    text-decoration: line-through; text-decoration-color: var(--blush); text-decoration-thickness: 2px;
  }
  .now-val { font: 700 30px var(--mono); color: var(--matcha); }
  .off {
    margin-top: 14px; display: inline-block;
    font: 700 14px var(--mono); color: #B4453F;
    background: #FFF0F3; border: 1px solid #FFD6E0; border-radius: 99px; padding: 7px 16px;
  }
  .clean .now-val { color: var(--matcha); }

  /* ---------- the fixes ---------- */
  .sectionlead {
    font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase;
    color: var(--soft); margin: 28px 0 12px; text-align: center;
  }
  .fix { padding: 18px 20px; }
  .fixtop { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .ref { font: 700 14px var(--mono); color: var(--ink); }
  .tag {
    font: 700 10px var(--body); letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 99px;
  }
  .tag.proven { background: #E4F8F1; color: #23795F; }
  .tag.check  { background: #FFF6E0; color: #96660A; }
  .tag.held   { background: #F2EFFB; color: #5B4BD6; }
  .why { color: var(--soft); font-size: 14px; margin-bottom: 12px; }
  .code { font: 500 12.5px/1.9 var(--mono); background: var(--milk); border-radius: 12px; padding: 10px 14px; }
  .code div { display: flex; gap: 10px; }
  .code .mark { width: 12px; flex: none; font-weight: 700; }
  .code .out .mark, .code .out code { color: var(--blush); }
  .code .in  .mark, .code .in  code { color: #23795F; }
  .code code { overflow-wrap: anywhere; }
  .moved { margin-top: 10px; font: 500 13px var(--mono); color: var(--soft); }
  .moved b { color: var(--matcha); font-weight: 700; }

  .retryline {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--edge);
    font-size: 13px; color: var(--soft);
  }
  .retryline b { color: var(--honey); font-weight: 700; }

  /* ---------- details, collapsed by default ---------- */
  details { margin-top: 22px; }
  summary {
    cursor: pointer; color: var(--faint); font-size: 13px; text-align: center;
    list-style: none; padding: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--iris-d); }
  .log {
    font: 400 11.5px/1.8 var(--mono); color: var(--soft);
    background: var(--card); border: 1px solid var(--edge); border-radius: 14px;
    padding: 14px 16px; max-height: 260px; overflow: auto; margin-top: 8px;
  }
  .log div { display: flex; gap: 10px; }
  .log .tm { color: var(--faint); flex: none; width: 46px; text-align: right; }
  .log .verified b { color: var(--matcha); }
  .log .rejected b { color: var(--honey); }

  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 34px; }
  footer code { font: 500 11px var(--mono); color: var(--soft); }

  .hidden { display: none !important; }
  .pop { animation: pop .45s cubic-bezier(.2,1.3,.5,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }

  #eyes { transform-origin: center; }
  .scanning #eyes { animation: scan 1.5s ease-in-out infinite; }
  @keyframes scan { 0%,100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
  .alert #cheekL, .alert #cheekR { opacity: .95; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 28px; }
    .now-val { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <svg class="face" id="face" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Cassandra">
      <path d="M36 5 61 15v20c0 15-10.5 27-25 32C21.5 62 11 50 11 35V15z"
            fill="#F2EFFB" stroke="#7B6CF6" stroke-width="3" stroke-linejoin="round"/>
      <ellipse id="cheekL" cx="24" cy="41" rx="5" ry="3.4" fill="#FF8BA7" opacity=".45"/>
      <ellipse id="cheekR" cx="48" cy="41" rx="5" ry="3.4" fill="#FF8BA7" opacity=".45"/>
      <g id="eyes" fill="#33304A">
        <circle cx="27.5" cy="33" r="3.4"/>
        <circle cx="44.5" cy="33" r="3.4"/>
      </g>
      <path d="M31.5 43.5c1.4 1.7 3.5 1.7 5 0" stroke="#33304A" stroke-width="2.4"
            stroke-linecap="round" fill="none"/>
    </svg>
    <h1>Cassandra</h1>
    <p class="promise">
      She checks the spreadsheet your numbers come from, fixes what is broken,
      and <b>proves every fix by recalculating the file</b>.
    </p>
  </div>

  <!-- step 1 -->
  <div class="card start" id="start">
    <div class="filename">saas_projection_<span>v11</span>.xlsx</div>
    <div>
      <button id="go">Check this workbook</button>
    </div>
    <p class="hint">Takes about two minutes. Nothing in your file is changed.</p>
  </div>

  <!-- step 2 -->
  <div class="card hidden" id="working" aria-live="polite">
    <div class="now" id="nowrow">
      <div class="txt">
        <div class="phase" id="phase">Waking up</div>
        <div class="detail" id="detail">&nbsp;</div>
      </div>
    </div>
    <div class="beads" id="beads"></div>
  </div>

  <!-- step 3 -->
  <div class="card verdict hidden" id="verdict"></div>
  <div id="fixes"></div>

  <details id="more" class="hidden">
    <summary>See everything she did</summary>
    <div class="log" id="log"></div>
  </details>

  <footer>
    <span id="engine">Gemini 3.5 Flash on Vertex AI</span><br>
    <code id="conn">connecting</code>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);

/* The seven things she does, in order. The activity line names the current one. */
const PHASES = [
  { key: "read",   label: "Reading the workbook" },
  { key: "calc",   label: "Calculating every cell" },
  { key: "hunt",   label: "Looking for trouble" },
  { key: "labels", label: "Reading the labels" },
  { key: "judge",  label: "Deciding what actually matters" },
  { key: "fix",    label: "Writing a fix" },
  { key: "prove",  label: "Proving it by recalculating" },
];
const PHASE_OF = {
  start: 0, parsed: 0, mapped: 0, clustered: 0,
  baseline: 1, detected: 2, agent: 3, agent_finding: 3,
  confirmed: 4, dismissed: 4, resolved_upstream: 4,
  patching: 5, rejected: 5, verified: 6, quarantined: 6, stored: 6, done: 6,
};

let at = -1, warned = false, RUN = null;

$("beads").innerHTML = PHASES.map(() => `<div class="bead"></div>`).join("");
const beads = [...document.querySelectorAll(".bead")];

const fmt = v => typeof v === "number"
  ? v.toLocaleString(undefined, { maximumFractionDigits: 0 })
  : (v ?? "");

const es = new EventSource("/events");
es.onopen  = () => $("conn").textContent = "connected to the agent";
es.onerror = () => $("conn").textContent = "reconnecting";
es.onmessage = e => handle(JSON.parse(e.data));

function handle(ev) {
  logLine(ev);
  if (ev.kind === "stored" && ev.run_id) return load(ev.run_id);
  if (ev.kind === "fatal") {
    $("phase").textContent = "That did not work";
    $("detail").textContent = ev.message || "";
    $("go").disabled = false;
    return;
  }

  const idx = PHASE_OF[ev.kind];
  if (idx === undefined) return;

  show("working");
  $("face").classList.add("scanning");

  if (idx > at) { at = idx; }
  beads.forEach((b, i) => b.classList.toggle("on", i <= at));

  /* A rejected patch is the most important thing she does. Say so plainly. */
  if (ev.kind === "rejected") {
    warned = true;
    $("nowrow").classList.add("retry");
    $("face").classList.add("alert");
    $("phase").textContent = "That fix did not hold up. Trying another.";
    $("detail").textContent = ev.message || "";
    beads[5].classList.add("warn");
    return;
  }
  $("nowrow").classList.remove("retry");
  $("face").classList.remove("alert");
  $("phase").textContent = PHASES[at].label;
  $("detail").textContent = shorten(ev);
}

function shorten(ev) {
  const m = ev.message || "";
  if (ev.kind === "verified") return "proven: " + m.split(": ").slice(-1)[0];
  if (ev.kind === "confirmed") return m.split(":")[0];
  if (ev.kind === "dismissed") return "set aside " + m.split(" ")[0] + ", it is fine";
  return m.length > 82 ? m.slice(0, 80) + "…" : m;
}

function logLine(ev) {
  const row = document.createElement("div");
  row.className = ev.kind || "";
  row.innerHTML = `<span class="tm">${(ev.t ?? 0).toFixed(1)}s</span><b></b>`;
  row.querySelector("b").textContent = ev.message || "";
  $("log").appendChild(row);
  $("log").scrollTop = $("log").scrollHeight;
}

function show(id) { $(id).classList.remove("hidden"); }

$("go").onclick = async () => {
  $("go").disabled = true;
  at = -1; warned = false;
  $("log").innerHTML = "";
  $("fixes").innerHTML = "";
  $("verdict").classList.add("hidden");
  $("more").classList.add("hidden");
  beads.forEach(b => b.classList.remove("on", "warn"));
  show("working");
  try {
    await fetch("/api/audit", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: "demo/saas_projection_v11.xlsx" }),
    });
  } catch { $("go").disabled = false; }
};

async function load(id) {
  RUN = await (await fetch("/api/runs/" + id)).json();
  if (RUN.error) return;
  $("face").classList.remove("scanning", "alert");
  beads.forEach(b => b.classList.add("on"));
  $("phase").textContent = "Done";
  $("detail").textContent = `${RUN.cell_count} cells checked in ${((RUN.finished_at - RUN.started_at) || 0).toFixed(0)} seconds`;
  paint();
  $("go").disabled = false;
}

function paint() {
  const fixed = (RUN.results || []).filter(r => r.status === "repaired");
  const h = RUN.headline || {};

  const v = $("verdict");
  v.classList.remove("hidden");
  v.classList.add("pop");
  if (!h.cell) {
    v.innerHTML = `<div class="label">The verdict</div>
      <div class="name">Nothing was wrong.</div>
      <p class="why">Every figure in this workbook computes what its label says it does.</p>`;
  } else {
    const off = Math.abs((h.after ?? 0) - (h.before ?? 0));
    v.innerHTML = `
      <div class="label">The number you would have shown someone</div>
      <div class="name">${esc(h.label || h.cell)}</div>
      <div class="nums">
        <span class="was">${fmt(h.before)}</span>
        <span style="color:var(--faint)">&rarr;</span>
        <span class="now-val">${fmt(h.after)}</span>
      </div>
      <div class="off">off by ${fmt(off)}</div>`;
  }

  if (fixed.length) {
    $("fixes").innerHTML =
      `<div class="sectionlead">${fixed.length} fix${fixed.length === 1 ? "" : "es"}, each proven by recalculation</div>`
      + fixed.map(card).join("");
  }
  $("more").classList.remove("hidden");
}

function card(r) {
  const retries = (r.attempts || []).filter(a => !a.passed);
  const tag = r.needs_human_intent
    ? `<span class="tag check">worth a look</span>`
    : `<span class="tag proven">proven</span>`;
  return `<div class="card fix pop">
    <div class="fixtop"><span class="ref">${esc(r.cell)}</span>${tag}</div>
    <div class="why">${esc(r.explanation || r.summary || "")}</div>
    <div class="code">
      <div class="out"><span class="mark">-</span><code>${esc(r.original_formula)}</code></div>
      <div class="in"><span class="mark">+</span><code>${esc(r.final_formula)}</code></div>
    </div>
    <div class="moved">${fmt(r.value_before)} &rarr; <b>${fmt(r.value_after)}</b></div>
    ${retries.length ? `<div class="retryline">
      <b>Her first attempt failed.</b> ${esc(retries[0].reason)} She tried again.
    </div>` : ""}
  </div>`;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

fetch("/api/health").then(r => r.json()).then(h => {
  $("engine").textContent = `${h.model} on ${h.vertex === "TRUE" ? "Vertex AI" : "the Gemini API"}`;
}).catch(() => {});

fetch("/api/runs").then(r => r.json()).then(rows => {
  if (rows && rows.length) load(rows[0].run_id);
}).catch(() => {});
</script>
</body>
</html>
